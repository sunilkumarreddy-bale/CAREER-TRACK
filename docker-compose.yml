# Production-like stack: MongoDB + CareerTrack on http://localhost:5000
# Usage: cp .env.example .env  (set JWT_SECRET)  →  docker compose up -d --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/careertrack
      NODE_ENV: production
      PORT: 5000
      # Plain-HTTP localhost access; set to true (or remove) behind HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${APP_PORT:-5000}:5000"

volumes:
  mongo-data:
